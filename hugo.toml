baseURL = 'https://ripper-pedro.github.io/RipperBlog/'
title = 'RipperBlog'
theme = 'lumenveil'
defaultContentLanguage = 'pt-br'
defaultContentLanguageInSubdir = false
disableKinds = ['taxonomy']
ignoreErrors = ['error-disable-taxonomy']
# Search index and feeds
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[pagination]
  pagerSize = 6

[taxonomies]
  blog_classification = "blog_classifications"
  project_classification = "project_classifications"

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true

[permalinks]
  blog = '/blog/:slug/'

[imaging]
  quality = 85

[params]
  description = 'My name is Pedro Ripper. Welcome to my little corner of the internet.'
  author = 'Ripper'
  initial = 'R'
  avatar = ''
  intro = 'Meu nome é Pedro Ripper, bem vindo ao meu cantinho na internet.'
  intro_en = 'My name is Pedro Ripper. Welcome to my little corner of the internet.'
  email = 'pedromripper@gmail.com'
  github = 'https://github.com/ripper-pedro'
  linkedin = 'https://www.linkedin.com/in/pedro-m-ripper/'
  discord = 'https://discord.com/users/376453662345789440'
  twitter = ''
  since = 2026
  copyright = 'CC BY-NC-ND 4.0 DEED'
  copyright_url = 'https://creativecommons.org/licenses/by-nc-nd/4.0/'
  mainSections = ['blog']
  highlight = 'hljs'
  math = true

[menus]
  [[menus.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    identifier = 'about'
    name = 'About'
    pageRef = '/about'
    weight = 20
  [[menus.main]]
    identifier = 'projects'
    name = 'Projects'
    pageRef = '/projects'
    weight = 30
  [[menus.main]]
    identifier = 'blog'
    name = 'Blog'
    pageRef = '/blog'
    weight = 40
  [[menus.main]]
    identifier = 'contact'
    name = 'Contact'
    pageRef = '/contact'
    weight = 50

[languages]
  [languages.pt-br]
    languageName = 'Português'
    weight = 1
    [languages.pt-br.params]
      description = 'Meu nome é Pedro Ripper, bem vindo ao meu cantinho na internet.'
  [languages.en]
    languageName = 'English'
    weight = 2
    [languages.en.params]
      description = 'My name is Pedro Ripper. Welcome to my little corner of the internet.'
