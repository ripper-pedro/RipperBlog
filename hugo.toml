baseURL = 'https://ripper-pedro.github.io/RipperBlog/'
title = 'RipperBlog'
theme = 'lumenveil'

# Required output formats for search + taxonomy pages
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[pagination]
  pagerSize = 6

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"
  author = "authors"

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark.renderer]
    unsafe = true

[permalinks]
  posts = '/posts/:slug/'

[imaging]
  quality = 85

[params]
  description = "Ripper's personal blog."
  author = 'Ripper'
  initial = 'R'
  avatar = '/images/avatar.png'
  role = "Master's student"
  tagline = 'A luminous reading-first experience.'
  location = 'from Rio de Janeiro'
  status = 'Currently writing'
  email = 'you@example.com'
  github = 'https://github.com/Hansen1018'
  twitter = 'https://twitter.com/Hansen1018'
  since = 2002
  copyright = 'CC BY-NC-ND 4.0 DEED'
  copyright_url = 'https://creativecommons.org/licenses/by-nc-nd/4.0/'
  mainSections = ['posts']
  highlight = 'hljs'
  math = true

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 25
  [[menus.main]]
    name = 'Categories'
    pageRef = '/categories'
    weight = 30
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 40

[languages]
  [languages.pt-br]
    languageName = 'Português'
    weight = 1
  [languages.en]
    languageName = 'English'
    weight = 2