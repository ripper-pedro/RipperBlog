<script>
(() => {
  const form = document.getElementById('contact-form')
  if (!form) return
  form.addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(form)
    const body = [
      'Nome: ' + String(data.get('name') || '').trim(),
      'E-mail para resposta: ' + String(data.get('replyTo') || '').trim(),
      '',
      String(data.get('message') || '').trim()
    ].join('\n')
    const subject = 'Ticket do RipperBlog'
    const url = 'mailto:' + form.dataset.recipient + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body)
    window.location.href = url
  })
})()
</script>

<script type="module">
import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js';





const pswpPadding = () => window.innerWidth < 700
  ? { top: 20, right: 20, bottom: 20, left: 20 }
  : { top: 180, right: 180, bottom: 180, left: 180 };


















const getViewportSize = () => ({
  x: document.documentElement.clientWidth,
  y: document.documentElement.clientHeight
});

document.querySelectorAll('.pswp-gallery').forEach(g=>{
  new PhotoSwipeLightbox({
    gallery:g,children:'a.pswp-item',
    pswpModule:()=>import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js'),
    bgOpacity:.80, padding:pswpPadding(),showHideAnimationType:'fade',
    getViewportSizeFn: getViewportSize
  }).init();
});
document.querySelectorAll('.article-main').forEach(a=>{
  const inline=a.querySelectorAll('a.pswp-inline');
  if(!inline.length)return;
  new PhotoSwipeLightbox({
    gallery:a,children:'a.pswp-inline',
    pswpModule:()=>import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js'),
    bgOpacity:.80, padding:pswpPadding(),showHideAnimationType:'fade',
    getViewportSizeFn: getViewportSize
  }).init();
});













function pairGallery(g) {
  const items = Array.from(g.querySelectorAll('.pswp-item'));
  if (!items.length) return;
  const W = g.clientWidth;
  if (!W) return;
  
  
  
  
  
  
  
  if (W < 700) return;
  const cs = getComputedStyle(g);
  const gap = parseFloat(cs.columnGap || cs.gap) || 14;
  
  
  
  
  
  
  items.forEach(it => {
    it.style.flex = '';
    it.style.maxWidth = '';
    it.style.height = '';
    it.style.overflow = '';
    const img = it.querySelector('img');
    if (img) {
      img.style.width = '';
      img.style.height = '';
      img.style.objectFit = '';
      img.style.objectPosition = '';
    }
  });
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  const ratioOf = (it) => {
    const img = it.querySelector('img');
    if (img && img.naturalWidth > 0 && img.naturalHeight > 0) {
      return img.naturalWidth / img.naturalHeight;
    }
    return parseFloat(it.dataset.pswpRatio) || 1;
  };
  for (let i = 0; i < items.length; i += 2) {
    const a = items[i], b = items[i + 1];
    if (b) {
      const rA = ratioOf(a);
      const rB = ratioOf(b);
      const sum = rA + rB;
      const avail = W - gap;
      const wA = (rA / sum) * avail;
      const wB = (rB / sum) * avail;
      a.style.flex = '0 0 ' + wA + 'px';
      b.style.flex = '0 0 ' + wB + 'px';
      
      
    } else {
      
      
      
      a.style.flex = '0 0 ' + W + 'px';
      a.style.maxWidth = '100%';
    }
  }
  
  
  items.forEach(it => {
    const img = it.querySelector('img');
    if (img && !img.complete) {
      img.addEventListener('load', () => pairGallery(g), { once: true });
      img.addEventListener('error', () => pairGallery(g), { once: true });
    }
  });
}

function runPairing() {
  document.querySelectorAll('.pswp-gallery[data-pswp-layout="justified"]').forEach(pairGallery);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runPairing);
} else {
  runPairing();
}
window.addEventListener('load', runPairing);









let _lastIsMobile = window.innerWidth < 700;
let _pairResizeTimer;
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth < 700;
  if (isMobile && _lastIsMobile) return;
  _lastIsMobile = isMobile;
  clearTimeout(_pairResizeTimer);
  document.querySelectorAll('.pswp-gallery[data-pswp-layout="justified"] > .pswp-item').forEach(el => {
    el.style.flex = '';
    el.style.maxWidth = '';
  });
  _pairResizeTimer = setTimeout(runPairing, 150);
});
</script>
