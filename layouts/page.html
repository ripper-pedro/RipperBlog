{{ define "main" }}
<article class="about-page">
  <div class="breadcrumbs"><a href="{{ site.Home.RelPermalink }}">{{ if eq site.Language.Lang "en" }}Home{{ else }}Início{{ end }}</a><span>/</span><span>{{ .Title }}</span></div>
  <h1>{{ .Title }}</h1>
  <div class="about-page__intro prose">{{ .Content }}</div>
</article>
{{ end }}
